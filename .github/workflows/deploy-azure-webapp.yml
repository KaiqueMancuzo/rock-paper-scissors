name: Build and Deploy (Java 11 Tomcat) to Azure Web App | 10ABR-ENGDADOS

on:
  push:
    branches:
      - main  # ex: main

env:
  AZURE_WEBAPP_NAME: pedrapapeltesourav1x1  # mesmo nome do %APP%

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Find WAR file
        run: |
          WAR_PATH=$(ls -1 target/*.war | head -n 1)
          echo "WAR_PATH=$WAR_PATH" >> $GITHUB_ENV

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: pedrapapeltesourav1x1
          publish-profile: ${{ secrets.SECRET_PEDRAPAPELTESOURA }}
          package: ${{ env.WAR_PATH }}
